<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Career Roast AI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">
  <div class="card">

    <h1>Career Roast AI 💀</h1>

    <p class="subtitle">
      Upload your resume and optionally add your GitHub.
      Get brutally honest AI feedback on your career.
    </p>

    <form id="careerForm">

      <!-- NAME -->
      <input
        type="text"
        id="name"
        placeholder="Full Name"
        required
      >

      <!-- EMAIL -->
      <input
        type="email"
        id="email"
        placeholder="Email Address"
        required
      >

      <!-- DOMAIN -->
      <select id="field" required>
        <option value="">Select Career Domain</option>
        <option>Engineering</option>
        <option>Healthcare</option>
        <option>Business</option>
        <option>Education</option>
        <option>Law</option>
        <option>Finance</option>
        <option>Research</option>
        <option>Design</option>
        <option>Government</option>
        <option>Other</option>
      </select>

      <!-- ROLE -->
      <input
        type="text"
        id="role"
        placeholder="Target Role (e.g. AI Engineer, Lawyer, Designer)"
        required
      >

      <!-- GITHUB OPTIONAL (CLEAN VERSION) -->
      <div class="optional-section">

        <label for="github">
          GitHub Username <span class="optional">(optional)</span>
        </label>

        <input
          type="text"
          id="github"
          placeholder="e.g. aadya123"
        >

        <small>
          Only relevant for technical roles like Engineering or Data Science
        </small>

      </div>

      <!-- RESUME -->
      <input
        type="file"
        id="resume"
        accept=".pdf"
        required
      >

      <!-- BUTTON -->
      <button type="submit">
        Analyze My Career 💀
      </button>

    </form>

    <div id="status"></div>
    <div id="report"></div>

  </div>
</div>

<script src="script.js"></script>

</body>
</html>
